# Netlify 部署配置
#
# 这个文件告诉 Netlify 三件事：
#   1. 用什么命令打包（和本地一样）
#   2. 打包产物在哪个目录
#   3. 数据库请求怎么中转 + 找不到的路径怎么办

[build]
  command = "npm run build"
  publish = "dist"

# ============================================================================
#  数据库请求中转（很关键，别删）
#
#  【为什么需要】
#  Supabase 的服务器在国外（走 Cloudflare 的 IP）。国内有一部分网络、
#  运营商、地区连不上它。表现出来是一个很迷惑的现象：
#
#      网页能正常打开（网站在 Netlify 上，能连）
#      但一注册/登录就报「连不上数据库」
#
#  【这条规则做什么】
#  把 /api/xxx 的请求转发给真正的 Supabase 地址。
#  这样浏览器只跟「本站」说话，不直接去连国外服务器。
#
#  【附带好处】
#  同源请求 → 彻底没有跨域（CORS）问题，更快也更稳。
#
#  【前端怎么对上】
#  线上环境里，前端会把 https://<本站域名>/api 当作数据库地址
#  （见 src/lib/supabase.ts 里的 resolveSupabaseUrl）。
#  下面地址里的项目 ID 要和控制台里的项目一致。
#
#  ⚠️ 顺序很重要：这条必须排在下面那条「交给 index.html」的前面，
#     否则 /api/xxx 会被当成页面路径，返回 index.html 就没用了。
# ============================================================================
[[redirects]]
  from = "/api/*"
  to = "https://diakytzfcmqhoegfvxuc.supabase.co/:splat"
  status = 200
  force = true

# ============================================================================
#  单页应用路由回退
#
#  作用：任何找不到的路径都返回 index.html（状态码 200），剩下的交给前端路由。
#  不加这条的话，首页能开，但刷新 /records 这样的页面、或者把链接发给别人，都会 404。
# ============================================================================
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
